<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Neon Rim Arc Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Metallic Gold DAR Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Speedometer / Tachometer Gauge Arc -->
  <path d="M 105 345 A 165 165 0 1 1 407 345" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="26" stroke-linecap="round" />
  <path d="M 105 345 A 165 165 0 0 1 370 130" fill="none" stroke="url(#rimGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)" />

  <!-- High-end Supercar Silhouette at top arc -->
  <path d="M 175 200 C 195 170, 220 150, 256 150 C 292 150, 317 170, 337 200 L 365 218 C 375 224, 372 232, 358 232 L 154 232 C 140 232, 137 224, 147 218 Z" fill="url(#rimGrad)" opacity="0.85" />
  <circle cx="200" cy="232" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
  <circle cx="312" cy="232" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="5" />

  <!-- BIG BOLD ICONIC "DAR" TEXT -->
  <text 
    x="256" 
    y="345" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="132" 
    font-weight="950" 
    fill="url(#goldTextGrad)" 
    text-anchor="middle" 
    letter-spacing="6"
    filter="url(#glow)"
  >DAR</text>

  <!-- Subtitle Badge: "AUTO CRM" -->
  <rect x="156" y="388" width="200" height="46" rx="23" fill="url(#pillGrad)" />
  <text 
    x="256" 
    y="418" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="20" 
    font-weight="900" 
    fill="#ffffff" 
    text-anchor="middle" 
    letter-spacing="4"
  >AUTO CRM</text>

  <!-- Speedometer Needle Dot Indicator -->
  <circle cx="256" cy="150" r="8" fill="#38bdf8" />
</svg>
