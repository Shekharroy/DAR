<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Speedometer / Tachometer Gauge Arc -->
  <path d="M 120 340 A 150 150 0 1 1 392 340" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="24" stroke-linecap="round" />
  <path d="M 120 340 A 150 150 0 0 1 340 140" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Sleek Sports Car Silhouette -->
  <path d="M 160 300 C 180 270, 210 240, 256 240 C 302 240, 332 270, 352 300 L 375 320 C 385 328, 380 340, 365 340 L 147 340 C 132 340, 127 328, 137 320 Z" fill="url(#accentGrad)" opacity="0.9" />
  
  <!-- Wheels -->
  <circle cx="195" cy="340" r="26" fill="#0f172a" stroke="#3b82f6" stroke-width="8" />
  <circle cx="317" cy="340" r="26" fill="#0f172a" stroke="#06b6d4" stroke-width="8" />
  <circle cx="195" cy="340" r="10" fill="#ffffff" />
  <circle cx="317" cy="340" r="10" fill="#ffffff" />

  <!-- Speedometer Needle -->
  <line x1="256" y1="230" x2="310" y2="160" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="230" r="14" fill="#f59e0b" />
  <circle cx="256" cy="230" r="6" fill="#ffffff" />
  
  <!-- Auto CRM badge -->
  <rect x="180" y="380" width="152" height="38" rx="19" fill="#2563eb" />
  <text x="256" y="405" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">AUTOCRM</text>
</svg>
