<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient with High Depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Neon Rim Arc Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Metallic Platinum/Cyan DAR Text Gradient -->
    <linearGradient id="darGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f0f9ff" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Bottom Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full-bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Center Safe Zone Group (Within 380px circle safe zone) -->
  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)">
    <!-- Outer Arc Ring -->
    <circle cx="256" cy="256" r="236" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
    
    <!-- Tachometer Sweep Arc -->
    <path d="M 85 365 A 195 195 0 1 1 427 365" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="26" stroke-linecap="round" />
    <path d="M 85 365 A 195 195 0 0 1 390 120" fill="none" stroke="url(#rimGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)" />

    <!-- Tachometer Tick marks -->
    <line x1="85" y1="365" x2="105" y2="350" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="100" y1="210" x2="125" y2="218" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="65" x2="256" y2="90" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <line x1="412" y1="210" x2="387" y2="218" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />
    <line x1="427" y1="365" x2="407" y2="350" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round" />

    <!-- Sleek Automotive Hood / Aerodynamic Silhouette -->
    <path d="M 170 195 C 192 165, 222 145, 256 145 C 290 145, 320 165, 342 195 L 372 216 C 382 222, 378 230, 362 230 L 150 230 C 134 230, 130 222, 140 216 Z" fill="url(#rimGrad)" opacity="0.9" filter="url(#glow)" />
    <!-- Wheels -->
    <circle cx="190" cy="230" r="14" fill="#020617" stroke="#38bdf8" stroke-width="5" />
    <circle cx="322" cy="230" r="14" fill="#020617" stroke="#06b6d4" stroke-width="5" />

    <!-- BOLD ICONIC "DAR" LETTERING -->
    <text 
      x="256" 
      y="348" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="136" 
      font-weight="950" 
      fill="url(#darGrad)" 
      text-anchor="middle" 
      letter-spacing="5"
      filter="url(#glow)"
    >DAR</text>

    <!-- Subtitle Badge: "AUTO CRM" -->
    <rect x="146" y="386" width="220" height="46" rx="23" fill="url(#badgeGrad)" />
    <text 
      x="256" 
      y="417" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="19" 
      font-weight="900" 
      fill="#ffffff" 
      text-anchor="middle" 
      letter-spacing="4"
    >AUTO CRM</text>
  </g>
</svg>
